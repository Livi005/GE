name: Pruebas automáticas
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pruebas HTTP de login y permisos (servicios aislados, sin BD)
        run: dotnet test ASP.Net-backend/SchoolManagement.Api.Tests/SchoolManagement.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=auth-http.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-backend
          path: '**/TestResults/*.trx'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
